[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
dsp = { path = "../dsp" }
bytemuck = "1.25.0"
env_logger = "0.11.10"
log = "0.4.32"
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
